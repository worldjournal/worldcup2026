<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans TC',sans-serif; background:#f4f4f4; color:#222; }

.page-header { background:#fff; border-bottom:2px solid #c8a84b; padding:16px 20px 12px; }
.page-header .series { font-size:11px; letter-spacing:2px; color:#c8a84b; margin-bottom:4px; }
.page-header h1 { font-size:18px; font-weight:700; color:#111; }

/* Tab bar */
.tabs { display:flex; gap:4px; padding:12px 20px; background:#fff; border-bottom:1px solid #ddd; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { padding:7px 14px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; background:#eee; border:1px solid #ddd; color:#555; transition:all 0.15s; }
.tab:hover { background:#e0e0e0; }
.tab.active { background:#333; border-color:#333; color:#fff; }

/* Bracket wrapper — horizontal scroll */
.bracket-wrap { overflow-x:auto; padding:20px; min-height:600px; }
.bracket { display:flex; align-items:flex-start; gap:0; width:max-content; }

/* Column */
.col { display:flex; flex-direction:column; }
.col-header { font-size:10px; font-weight:700; color:#888; letter-spacing:1px; text-align:center; padding:0 8px 10px; white-space:nowrap; }

/* Match card */
.match-wrap { display:flex; align-items:center; }
.match { background:#fff; border:1px solid #ddd; border-radius:6px; overflow:hidden; width:170px; box-shadow:0 1px 4px rgba(0,0,0,0.08); flex-shrink:0; }
.match-meta { font-size:9px; color:#999; padding:3px 8px; text-align:right; border-bottom:1px solid #f0f0f0; background:#fafafa; }
.team { display:flex; align-items:center; padding:6px 8px; gap:6px; border-bottom:1px solid #f0f0f0; }
.team:last-of-type { border-bottom:none; }
.flag { font-size:13px; width:18px; text-align:center; flex-shrink:0; }
.tname { font-size:11px; font-weight:500; color:#222; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tname.tbd { color:#bbb; font-style:italic; font-weight:400; }
.tscore { font-size:12px; font-weight:700; color:#222; min-width:14px; text-align:right; }
.match-date { font-size:9px; color:#aaa; padding:3px 8px; background:#fafafa; border-top:1px solid #f0f0f0; display:flex; justify-content:space-between; }

/* Final card */
.match.final { border:2px solid #c8a84b; }
.match.final .match-meta { background:#fffbf0; color:#c8a84b; font-weight:700; }

/* Connector SVG column */
.conn-col { display:flex; flex-direction:column; width:28px; flex-shrink:0; }
.conn-svg { flex:1; }

/* Spacer between matches in a column */
.match-spacer { flex-shrink:0; }

/* Round panel */
.round-panel { display:none; }
.round-panel.active { display:block; }
</style>
</head>

// ── 建立比賽卡片 HTML ─────────────────────────────────────
function card(m, isFinal) {
  const at = m.a.n==="待定", bt = m.b.n==="待定";
  const cls = isFinal ? "match final" : "match";
  const meta = m.label ? `<div class="match-meta">${m.label}</div>` : `<div class="match-meta">${m.id}</div>`;
  return `<div class="${cls}">
    ${meta}
    <div class="team"><div class="flag">${m.a.f}</div><div class="tname${at?" tbd":""}">${m.a.n}</div><div class="tscore">${m.a.s}</div></div>
    <div class="team"><div class="flag">${m.b.f}</div><div class="tname${bt?" tbd":""}">${m.b.n}</div><div class="tscore">${m.b.s}</div></div>
    <div class="match-date"><span>${m.date}</span><span>${m.venue}</span></div>
  </div>`;
}

// ── 建立連接線 SVG ────────────────────────────────────────
// n = 這欄有幾個「對」要合併（每對2個比賽）
function connSVG(n, cardH, gap) {
  // cardH: 每張卡片高度(px), gap: 卡片間距
  const pairH = cardH * 2 + gap; // 一對的高度
  const totalH = pairH * n + gap * (n-1);
  let paths = "";
  for (let i=0; i<n; i++) {
    const topY = i * (pairH + gap) + cardH / 2;
    const botY = topY + pairH - cardH;
    const midY = (topY + botY) / 2;
    // 右側括弧形
    paths += `<line x1="0" y1="${topY}" x2="14" y2="${topY}" stroke="#c8a84b" stroke-width="1" stroke-opacity="0.5"/>`;
    paths += `<line x1="14" y1="${topY}" x2="14" y2="${midY}" stroke="#c8a84b" stroke-width="1" stroke-opacity="0.5"/>`;
    paths += `<line x1="14" y1="${midY}" x2="28" y2="${midY}" stroke="#c8a84b" stroke-width="1" stroke-opacity="0.5"/>`;
    paths += `<line x1="14" y1="${midY}" x2="14" y2="${botY}" stroke="#c8a84b" stroke-width="1" stroke-opacity="0.5"/>`;
    paths += `<line x1="0" y1="${botY}" x2="14" y2="${botY}" stroke="#c8a84b" stroke-width="1" stroke-opacity="0.5"/>`;
  }
  return `<svg width="28" height="${totalH}" style="flex-shrink:0;">${paths}</svg>`;
}

// ── 建立一個欄位 ──────────────────────────────────────────
function buildCol(label, matches, isFinal) {
  const gap = 8;
  let html = `<div class="col"><div class="col-header">${label}</div>`;
  matches.forEach((m, i) => {
    if (i > 0) html += `<div style="height:${gap}px"></div>`;
    html += card(m, isFinal);
  });
  html += `</div>`;
  return html;
}

// ── 32強分頁：32強→16強→8強→準決賽→決賽 ────────────────
function buildR32() {

  const fin = [M.M104];

  const cH = 80, gap = 8;
  let html = "";
  html += buildCol("32強 (6/28–7/4)", r32, false);
  html += `<div style="display:flex;flex-direction:column;width:28px;flex-shrink:0;padding-top:22px;">${connSVG(8, cH, gap)}</div>`;
  html += buildCol("16強 (7/5–7/7)", r16, false);
  html += `<div style="display:flex;flex-direction:column;width:28px;flex-shrink:0;padding-top:22px;margin-top:${cH/2 + gap/2}px;">${connSVG(4, cH, gap*2+cH)}</div>`;
  html += `<div style="margin-top:${cH/2+gap/2}px;">` + buildCol("8強 (7/9–7/11)", qf, false) + "</div>";
  html += `<div style="display:flex;flex-direction:column;width:28px;flex-shrink:0;padding-top:22px;margin-top:${cH*2+gap*3}px;">${connSVG(2, cH, cH*3+gap*4)}</div>`;
  html += `<div style="margin-top:${cH*2+gap*3}px;">` + buildCol("準決賽 (7/14–7/15)", sf, false) + "</div>";
  html += `<div style="display:flex;flex-direction:column;width:28px;flex-shrink:0;padding-top:22px;margin-top:${cH*5+gap*8}px;">${connSVG(1, cH, cH*5+gap*4)}</div>`;
  html += `<div style="margin-top:${cH*5+gap*8}px;">` + buildCol("決賽 (7/19)", fin, true) + "</div>";
  el.innerHTML = html;
}

// ── 決賽分頁 ─────────────────────────────────────────────

  html += `<div style="border-top:1px dashed #ddd;padding-top:${gap}px;">`;

// ── 分頁切換 ─────────────────────────────────────────────
function show(id, el) {
  document.querySelectorAll('.round-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

// ── 初始化 ───────────────────────────────────────────────
