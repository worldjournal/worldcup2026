.tscore { font-size:12px; font-weight:700; color:#333; min-width:22px; text-align:center; background:#f0f0f0; border-radius:3px; padding:1px 4px; }
.match-foot { font-size:8px; color:#aaa; padding:3px 8px; background:#fafafa; border-top:1px solid #f0f0f0; display:flex; justify-content:space-between; }

function flagImg(name) {
  const code = FLAG_CODES[name];
  if (!code) return `<span style="font-size:12px;color:#ccc;">🏳</span>`;
  return `<img src="https://purecatamphetamine.github.io/country-flag-icons/3x2/${code}.svg" width="20" height="14" alt="${name}" style="border-radius:2px;vertical-align:middle;display:inline-block;">`;
}

function card(m, type) {
  const isFinal = type==='final', isThird = type==='third';
  const cls = isFinal?'match final-card':isThird?'match third-card':'match';
  const at = m.a.n.includes("待定")||m.a.n.includes("組")||m.a.n.includes("最佳")||m.a.n.includes("敗者")||m.a.n.includes("勝者");
  const bt = m.b.n.includes("待定")||m.b.n.includes("組")||m.b.n.includes("最佳")||m.b.n.includes("敗者")||m.b.n.includes("勝者");
  const title = isFinal?'🏆 2026 FIFA 世界盃 決賽':isThird?'🥉 季軍賽':'';
  const sub = isFinal||isThird ? `<div class="match-sub">${m.venue}</div>` : '';
  const titleHtml = title ? `<div class="match-title">${title}</div>${sub}` : '';
  const sa = m.a.s !== "" ? m.a.s : "–";
  const sb = m.b.s !== "" ? m.b.s : "–";
  return `<div class="${cls}">
    ${titleHtml}
    <div class="team"><div class="flag">${flagImg(m.a.n)}</div><div class="tname${at?" tbd":""}">${m.a.n}</div><div class="tscore">${sa}</div></div>
    <div class="team"><div class="flag">${flagImg(m.b.n)}</div><div class="tname${bt?" tbd":""}">${m.b.n}</div><div class="tscore">${sb}</div></div>
    <div class="match-foot"><span>${m.date} · ${m.time}</span><span>${isFinal||isThird?'':m.venue}</span></div>
  </div>`;
}

function buildBracket(containerId, rounds) {
  const CARD_H = 96;
  const container = document.getElementById(containerId);
  const n0 = rounds[0].matches.length;
  const GAP_H = n0 >= 16 ? 28 : 12;
  const totalH = n0 * CARD_H + (n0 - 1) * GAP_H;

  let labelsHtml = '';
  rounds.forEach((r, i) => {
    labelsHtml += `<div style="width:185px;flex-shrink:0;font-size:10px;font-weight:700;color:#888;text-align:center;letter-spacing:1px;padding-bottom:8px;">${r.label}</div>`;
    if (i < rounds.length - 1) labelsHtml += `<div style="width:28px;flex-shrink:0;"></div>`;
  });

  let bodyHtml = `<div style="display:flex;align-items:flex-start;">`;
  rounds.forEach((r, ri) => {
    const n = r.matches.length;
    const slotH = totalH / n;
    bodyHtml += `<div style="width:185px;flex-shrink:0;display:flex;flex-direction:column;height:${totalH}px;justify-content:space-around;">`;
    r.matches.forEach(m => {
      bodyHtml += `<div style="display:flex;align-items:center;height:${slotH}px;">${card(m, r.type||'')}</div>`;
    });
    bodyHtml += `</div>`;

    if (ri < rounds.length - 1) {
      const pairsCount = n / 2;
      const pairSlotH = totalH / pairsCount;
      const cardCenter = slotH / 2;
      let lines = '';
      for (let i = 0; i < pairsCount; i++) {
        const topY = i * pairSlotH + cardCenter;
        const botY = i * pairSlotH + slotH + cardCenter;
        const midY = (topY + botY) / 2;
        lines += `<line x1="0" y1="${topY}" x2="14" y2="${topY}" stroke="#c8a84b" stroke-width="1.5" stroke-opacity="0.7"/>`;
        lines += `<line x1="0" y1="${botY}" x2="14" y2="${botY}" stroke="#c8a84b" stroke-width="1.5" stroke-opacity="0.7"/>`;
        lines += `<line x1="14" y1="${topY}" x2="14" y2="${botY}" stroke="#c8a84b" stroke-width="1.5" stroke-opacity="0.7"/>`;
        lines += `<line x1="14" y1="${midY}" x2="28" y2="${midY}" stroke="#c8a84b" stroke-width="1.5" stroke-opacity="0.7"/>`;
      }
      bodyHtml += `<svg width="28" height="${totalH}" style="flex-shrink:0;">${lines}</svg>`;
    }
  });
  bodyHtml += `</div>`;

  container.innerHTML = `
    <div style="overflow-x:auto;padding-bottom:8px;">
      <div style="display:flex;margin-bottom:8px;">${labelsHtml}</div>
      ${bodyHtml}
    </div>
    ${containerId==='r32'?'<p style="font-size:10px;color:#aaa;margin-top:12px;">※ 所有時間為美東時間（ET）</p>':''}
  `;
}

  const d = today.getFullYear()*10000 + (today.getMonth()+1)*100 + today.getDate();
  let tabId;
  if      (d >= 20260719) tabId = 'final';
  else if (d >= 20260714) tabId = 'sf';
  else if (d >= 20260709) tabId = 'qf';
  else if (d >= 20260704) tabId = 'r16';
  else                    tabId = 'r32';
  const tab = document.querySelector(`.tab[onclick="show('${tabId}',this)"]`);
  if (tab) show(tabId, tab);
}
autoTab();
