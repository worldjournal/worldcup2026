<style>

  .wc-header-left { display: flex; align-items: center; gap: 10px; }
  .wc-trophy { font-size: 24px; filter: drop-shadow(0 0 6px rgba(212,175,55,.6)); }
  .wc-title { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 700; letter-spacing: .04em; }
  .wc-subtitle { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 2px; }

  /* Stage tabs */
  .stage-tabs { display: flex; background: #111827; border-bottom: 2px solid var(--red); }
  .stage-tab { flex: 1; padding: 8px 4px; cursor: pointer; border: none; background: none;
    color: rgba(255,255,255,.45); font-family: inherit; font-size: 11px; font-weight: 700;
    text-align: center; white-space: nowrap; transition: color .2s; letter-spacing: .02em; }
  .stage-tab:hover { color: rgba(255,255,255,.8); }
  .stage-tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); margin-bottom: -2px; }

  .date-bar { background: var(--mid); overflow-x: auto; scrollbar-width: none; display: flex; }
  .date-bar::-webkit-scrollbar { display: none; }
  .date-btn { flex: 0 0 auto; padding: 9px 14px; cursor: pointer; border: none; background: none; color: rgba(255,255,255,.5); font-family: inherit; font-size: 12px; font-weight: 700; text-align: center; white-space: nowrap; transition: color .2s; line-height: 1.4; }
  .date-btn:hover { color: #fff; }
  .date-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); margin-bottom: -2px; }
  .date-btn.today { color: #fff; }
  .date-btn .day-num { font-size: 16px; display: block; }
  .date-btn .day-name { font-size: 10px; opacity: .7; }

  .matches { padding: 8px 0; }
  .match-row { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f0ede8; gap: 12px; }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: #fdfcf8; }

  .match-time { font-size: 15px; font-weight: 700; color: var(--dark); min-width: 58px; }
  .match-teams { flex: 1; }
  .match-teams .teams { font-size: 16px; font-weight: 500; }
  .match-teams .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .match-label { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--light);
    padding: 3px 8px; border-radius: 2px; white-space: nowrap; text-align: center; min-width: 48px; }
  .match-label.knockout { background: #fff3cd; color: #7a5c00; }
  .match-label.r16 { background: #fde8e8; color: #8b0000; }

  .match-tv { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .tv-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 2px; white-space: nowrap; }
  .tv-FOX { background: #003087; color: #fff; }
  .tv-FS1 { background: #c8102e; color: #fff; }
  .tv-Telemundo { background: #7b2d8b; color: #fff; }

  .no-matches { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 14px; }

  .wc-legend { display: flex; gap: 12px; padding: 10px 14px; background: var(--light); border-top: 1px solid var(--border); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }

  .wc-footer { padding: 8px 14px; background: var(--light); border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
  .wc-footer span { font-size: 11px; color: var(--muted); }

</head>

const STAGES = [
  {id:"group", label:"小組賽"},
  {id:"r32",   label:"32強"},
];

const DAYS_ZH = ["日","一","二","三","四","五","六"];

let currentStage = "group";

function buildStageTabs() {
  const bar = document.getElementById("stageTabs");
  STAGES.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "stage-tab" + (s.id === currentStage ? " active" : ""); // currentStage already set
    btn.textContent = s.label;
    btn.dataset.stage = s.id;
    btn.onclick = () => switchStage(s.id);
    bar.appendChild(btn);
  });
}

function switchStage(stageId) {
  currentStage = stageId;
  document.querySelectorAll(".stage-tab").forEach(b =>
    b.classList.toggle("active", b.dataset.stage === stageId));
  buildDateBar(stageId);
}

function buildDateBar(stageId) {
  const stageMates = MATCHES.filter(m => m.stage === stageId);
  const dates = [...new Set(stageMates.map(m => m.date))].sort();
  const today = todayET();
  const bar = document.getElementById("dateBar");
  bar.innerHTML = "";
  dates.forEach(d => {
    const dt = new Date(d + "T12:00:00");
    const btn = document.createElement("button");
    btn.className = "date-btn" + (d === today ? " today" : "");
    btn.innerHTML = `<span class="day-num">${dt.getMonth()+1}/${dt.getDate()}</span><span class="day-name">週${DAYS_ZH[dt.getDay()]}</span>`;
    btn.onclick = () => showDate(d, stageId);
    btn.dataset.date = d;
    bar.appendChild(btn);
  });
  // auto-select: today if in stage, else first upcoming, else first date
  let target = dates[0];
  if (dates.includes(today)) target = today;
  else {
    const upcoming = dates.find(d => d >= today);
    if (upcoming) target = upcoming;
  }
  showDate(target, stageId);
}

function showDate(date, stageId) {
  document.querySelectorAll(".date-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.date === date));
  const matches = MATCHES.filter(m => m.stage === stageId && m.date === date);
  const list = document.getElementById("matchList");
  if (!matches.length) {
    list.innerHTML = `<div class="no-matches">本日無賽事</div>`;
    return;
  }
  list.innerHTML = matches.map(m => {
    const homeZh = m.home.includes("勝者") || m.home.includes("敗者") || m.home.includes("組") || m.home.includes("佳") ? m.home : zh(m.home);
    const awayZh = m.away.includes("勝者") || m.away.includes("敗者") || m.away.includes("組") || m.away.includes("佳") ? m.away : zh(m.away);
    const lc = m.labelClass || "";
    return `
    <div class="match-row">
      <div class="match-time">${m.time}</div>
      <div class="match-teams">
        <div class="teams">${homeZh} vs ${awayZh}</div>
        <div class="meta">${vz(m.venue)}</div>
      </div>
      <div class="match-label ${lc}">${m.label}</div>
      <div class="match-tv">
        ${m.tv.map(t => `<span class="tv-badge tv-${t.replace(' ','')}">${t}</span>`).join("")}
      </div>
    </div>`;
  }).join("");
  const activeBtn = document.querySelector(`.date-btn[data-date="${date}"]`);
  if (activeBtn) activeBtn.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
}

// 用美東時間（ET, UTC-4夏令）取得今天日期
function todayET() {
  const now = new Date();
  const etOffset = -4 * 60;
  const etNow = new Date(now.getTime() + (etOffset - now.getTimezoneOffset()) * 60000);
  return etNow.toISOString().slice(0,10);
}

// 自動偵測今天屬於哪個賽段
function detectTodayStage() {
  const today = todayET();
  for (const s of STAGES) {
    const dates = MATCHES.filter(m => m.stage === s.id).map(m => m.date);
    if (dates.includes(today)) return s.id;
  }
  // 今天沒有比賽，找最近即將到來的賽段
  for (const s of STAGES) {
    const dates = MATCHES.filter(m => m.stage === s.id).map(m => m.date).sort();
    if (dates.some(d => d >= today)) return s.id;
  }
  return "r32";
}

currentStage = detectTodayStage();
buildStageTabs();
buildDateBar(currentStage);
